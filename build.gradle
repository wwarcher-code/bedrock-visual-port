plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

repositories {
	exclusiveContent {
		forRepository {
			maven {
				name = 'Modrinth'
				url = 'https://api.modrinth.com/maven'
			}
		}
		filter {
			includeGroup 'maven.modrinth'
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Hooked mods. Compiled against so hooks can target their classes; none is bundled.
	// Flashback is reached through the FREX flawless frames entrypoint, so it is runtime only.
	compileOnly "maven.modrinth:sodium:${project.sodium_version}"
	compileOnly "maven.modrinth:distanthorizons:${project.distanthorizons_version}"
	localRuntime "maven.modrinth:sodium:${project.sodium_version}"
	localRuntime "maven.modrinth:distanthorizons:${project.distanthorizons_version}"
	localRuntime "maven.modrinth:flashback:${project.flashback_version}"

	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
	useJUnitPlatform()
	// Optional: run BedrockPackIntegrationTest against a real pack, e.g.
	// .\gradlew.bat test --rerun -PbedrockPack="C:\XboxGames\Minecraft for Windows\Content\data\resource_packs"
	def bedrockPack = providers.gradleProperty('bedrockPack')
	inputs.property 'bedrockPack', bedrockPack.orElse('')
	systemProperty 'bedrockPack', bedrockPack.orElse('').get()
	// -PupdateBedrockPack rewrites the Bedrock test pack's scene function from TestScene.java.
	def updateBedrockPack = providers.gradleProperty('updateBedrockPack').isPresent()
	inputs.property 'updateBedrockPack', updateBedrockPack
	systemProperty 'updateBedrockPack', updateBedrockPack
	inputs.dir('bedrock/test-pack')
	testLogging {
		showStandardStreams = true
	}
}

// The Bedrock reference pack (see TESTING.md), as a .mcpack Bedrock imports on double-click. The built file is
// committed so it arrives with a git pull: .\gradlew.bat bedrockTestPack after changing bedrock\test-pack.
tasks.register('bedrockTestPack', Zip) {
	from 'bedrock/test-pack'
	destinationDirectory = file('bedrock')
	archiveFileName = 'BedrockVisualsTest.mcpack'
	preserveFileTimestamps = false
	reproducibleFileOrder = true
}

// The commit the mod was built from, shown in test reports so a stale build is obvious.
def gitCommit = providers.exec {
	commandLine 'git', 'describe', '--always', '--dirty'
	ignoreExitValue = true
}.standardOutput.asText.map { it.trim() ?: 'unknown' }

processResources {
	def props = [
		version                : project.version,
		sodium_version         : project.sodium_loaded_version,
		distanthorizons_version: project.distanthorizons_loaded_version,
		flashback_version      : project.flashback_loaded_version,
		git_commit             : gitCommit.get(),
	]
	inputs.properties props

	filesMatching(['fabric.mod.json', 'bedrockvisuals.pins.properties', 'bedrockvisuals.build.properties']) {
		expand props
	}
}

// .\gradlew.bat runClient -PquickPlay=BVTest loads straight into that singleplayer world (test.cmd does this).
// The game gets 16 GB of heap (-PgameMemory=12G or any -Xmx size overrides it) and the ZGC collector.
tasks.named('runClient') {
	maxHeapSize = providers.gradleProperty('gameMemory').getOrElse('16G')
	// ZGC (generational, the only kind in Java 25): short pauses, so fewer stutters with Distant Horizons.
	jvmArgs '-XX:+UseZGC'
	def world = providers.gradleProperty('quickPlay')
	if (world.isPresent()) {
		args '--quickPlaySingleplayer', world.get()
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}
