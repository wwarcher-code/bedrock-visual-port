org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Every version below is pinned exactly. Sodium and Replay Mod internals are not API, and DH's API is pinned too,
# so the hooks target these builds only. Bump deliberately, one at a time, and re-run the spikes.

# Fabric (https://fabricmc.net/develop)
minecraft_version=26.3
loader_version=0.20.1
loom_version=1.19.3
fabric_api_version=0.165.0+26.3

# Hooked mods: Modrinth maven version, then the version the mod reports in game
# (checked at startup; a mismatch logs a warning).
sodium_version=mc26.3-0.9.2-fabric
sodium_loaded_version=0.9.2+mc26.3
distanthorizons_version=3.3.4-26.3
distanthorizons_loaded_version=3.3.4
replaymod_version=26.3-2.6.28
replaymod_loaded_version=26.3-2.6.28

# Mod
version=0.1.0
group=dev.bedrockvisuals
